<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaf'Map - Offline</title>
    <style>
        :root {
            --amber-500: #f59e0b;
            --amber-600: #d97706;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-500: #6b7280;
            --gray-800: #1f2937;
            --gray-900: #111827;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: var(--gray-900);
                color: var(--gray-50);
            }
            .card {
                background-color: var(--gray-800);
                border-color: #374151;
            }
            .text-muted { color: #9ca3af; }
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color: var(--gray-50);
                color: var(--gray-900);
            }
            .card {
                background-color: #ffffff;
                border-color: var(--gray-100);
            }
            .text-muted { color: var(--gray-500); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            padding: 3rem 2rem;
            border-radius: 1.5rem;
            border-width: 1px;
            border-style: solid;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 24rem;
            width: 90%;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fffbeb;
            border-radius: 1.5rem;
            color: var(--amber-500);
        }

        @media (prefers-color-scheme: dark) {
            .logo {
                background-color: rgba(245, 158, 11, 0.2);
            }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        p {
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--amber-500);
            color: white;
            font-weight: 700;
            padding: 0.75rem 2rem;
            border-radius: 1rem;
            text-decoration: none;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            background-color: var(--amber-600);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.1 2.182a10 10 0 0 1 3.8 0"/>
                <path d="M13.9 21.818a10 10 0 0 1-3.8 0"/>
                <path d="M17.609 3.721a10 10 0 0 1 2.69 2.7"/>
                <path d="M2.28 17.588a10 10 0 0 1-1.06-3.1"/>
                <path d="M20.53 17.588a10 10 0 0 1-2.69 2.7"/>
                <path d="M3.7 3.721a10 10 0 0 1 2.69-2.7"/>
                <path d="M21.72 10.412a10 10 0 0 1-1.06 3.1"/>
                <path d="M3.7 20.279a10 10 0 0 1-2.69-2.7"/>
                <circle cx="12" cy="12" r="4"/>
                <path d="m18 12-2-2"/>
                <path d="m18 12-2 2"/>
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p class="text-muted">It seems you've lost your internet connection. Please check your network and try again to access Kaf'Map.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
